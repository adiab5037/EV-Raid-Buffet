<style>
  :root{
    --bg-1:#eef1f5;
    --bg-2:#f6f7f9;
    --card:#ffffff;
    --card-2:#f7f8fa;
    --ink:#111f2e;
    --navy:#0e3f66;
    --navy-deep:#082944;
    --green:#4f8f5b;
    --green-dark:#3d7247;
    --gold:#a5813a;
    --muted:#64748b;
    --line:rgba(15,42,66,0.10);
    --danger:#b3413a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Tajawal',sans-serif;
    background: linear-gradient(175deg, var(--bg-1), var(--bg-2) 65%);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    letter-spacing:0.1px;
  }
  #app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    padding:18px 16px 90px;
    position:relative;
  }
  .balance-badge{
    position:absolute;
    top:18px; right:16px;
    display:flex; align-items:center; gap:6px;
    background:#ffffff;
    border:1px solid var(--line);
    box-shadow:0 2px 10px rgba(15,42,66,0.08);
    border-radius:30px;
    padding:7px 12px;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
    z-index:20;
  }
  .balance-badge.owe{color:#b3413a;border-color:rgba(179,65,58,0.35);animation:badgePulse 2.2s infinite;}
  .balance-badge.ok{color:var(--green-dark);}
  @keyframes badgePulse{0%{box-shadow:0 2px 10px rgba(179,65,58,0.10);}50%{box-shadow:0 2px 14px rgba(179,65,58,0.28);}100%{box-shadow:0 2px 10px rgba(179,65,58,0.10);}}
  .brand{
    text-align:center;
    padding:26px 0 16px;
  }
  .brand .eyebrow{
    display:inline-block;
    font-size:10.5px;
    letter-spacing:4.5px;
    color:#fff;
    background:var(--navy);
    padding:4px 14px;
    border-radius:3px;
    font-weight:700;
    margin-bottom:12px;
    font-family:'Tajawal',sans-serif;
  }
  .brand-logo{
    max-width:200px;
    width:60%;
    height:auto;
    margin:0 auto;
    display:block;
  }
  .brand p{
    margin:8px 0 0;
    font-size:12.5px;
    color:var(--muted);
    letter-spacing:0.6px;
  }
  .brand .rule{
    width:56px;height:2px;margin:14px auto 0;
    border-radius:2px;
    background:var(--gold);
  }
  .brand-wave{
    width:100%;
    height:14px;
    margin-top:-4px;
    margin-bottom:6px;
    display:block;
  }
  .warn-banner{
    background:#fdf1e8;
    border:1px solid #f0c894;
    color:#8a5a1a;
    border-radius:10px;
    padding:12px 14px;
    font-size:13px;
    margin-bottom:14px;
    line-height:1.7;
  }
  .warn-banner b{color:#a5600c;}
  .install-btn{
    display:block;
    width:100%;
    padding:11px;
    border-radius:8px;
    background:var(--navy);
    border:1.5px solid var(--navy);
    color:#fff;
    font-weight:700;
    font-size:13px;
    margin-bottom:14px;
    box-shadow:0 4px 12px rgba(15,42,74,0.2);
  }
  .card{
    position:relative;
    background:var(--card);
    color:var(--ink);
    border-radius:18px;
    padding:20px 18px 18px;
    box-shadow:0 2px 12px rgba(15,42,66,0.06);
    border:1px solid var(--line);
    border-right:4px solid var(--gold);
    margin-bottom:14px;
    overflow:hidden;
  }
  .card::before{
    content:'';
    position:absolute; top:0; right:0; left:0; height:4px;
    background:linear-gradient(90deg, var(--green), var(--navy));
  }
  .card h2{
    font-family:'Poppins',sans-serif;
    font-weight:700;
    font-size:17px;
    margin:0 0 12px;
    color:var(--navy);
    letter-spacing:0.2px;
    padding-bottom:10px;
    border-bottom:1px solid var(--line);
  }
  label{font-size:12.5px;font-weight:700;color:var(--ink);opacity:0.65;display:block;margin-bottom:6px;letter-spacing:0.2px;}
  input[type=text], input[type=email], input[type=tel], input[type=number], input[type=password]{
    width:100%;
    padding:11px 12px;
    border-radius:8px;
    border:1.5px solid var(--line);
    background:var(--card-2);
    font-family:'Tajawal';
    font-size:15px;
    color:var(--ink);
    outline:none;
  }
  input:focus{border-color:var(--gold);}
  button{
    font-family:'Tajawal';
    cursor:pointer;
    border:none;
  }
  .btn-main{
    width:100%;
    padding:13px;
    border-radius:14px;
    background:linear-gradient(135deg, var(--navy), var(--navy-deep));
    color:#fff;
    font-weight:700;
    font-size:14.5px;
    margin-top:10px;
    letter-spacing:0.3px;
    box-shadow:0 3px 10px rgba(14,63,102,0.22);
    transition:transform 0.12s ease, box-shadow 0.12s ease;
  }
  .btn-main:active{transform:translateY(1px); box-shadow:0 2px 6px rgba(14,63,102,0.18);}
  .btn-main:disabled{opacity:0.5;cursor:not-allowed;}
  .btn-ghost{
    padding:9px 14px;
    border-radius:8px;
    background:transparent;
    border:1.5px solid var(--navy);
    color:var(--navy);
    font-weight:700;
    font-size:12.5px;
  }
  .tabs{
    position:fixed;
    bottom:0;left:0;right:0;
    display:flex;
    justify-content:center;
    z-index:50;
  }
  .tabs-inner{
    width:100%;max-width:460px;
    display:flex;
    background:#ffffff;
    border-top:1px solid var(--line);
    border-radius:20px 20px 0 0;
    box-shadow:0 -4px 16px rgba(15,42,74,0.08);
  }
  .tab{
    flex:1;
    text-align:center;
    padding:10px 4px 8px;
    margin:6px 3px;
    background:none;
    border-radius:12px;
    color:var(--muted);
    opacity:0.75;
    font-size:11.5px;
    font-weight:700;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    transition:background 0.15s ease, opacity 0.15s ease;
  }
  .tab.active{opacity:1;color:var(--navy);background:rgba(14,63,102,0.08);}
  .tab.active .ic{color:var(--gold);}
  .tab .ic{font-size:19px;}
  .menu-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px dashed var(--line);
  }
  .menu-item:last-child{border-bottom:none;}
  .menu-item .name{font-weight:700;font-size:15px;}
  .price-row{display:flex;gap:6px;margin-top:6px;}
  .price-btn{
    padding:6px 12px;
    border-radius:20px;
    background:rgba(20,51,92,0.05);
    border:1px solid rgba(20,51,92,0.2);
    color:var(--navy);
    font-size:12px;
    font-weight:700;
  }
  .price-btn.selected{background:var(--green); border-color:var(--green); color:#fff;}
  .cart-bar{
    position:sticky;
    bottom:66px;
    background:var(--navy);
    color:#fff;
    border-radius:12px;
    padding:12px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-weight:800;
    box-shadow:0 8px 20px rgba(20,51,92,0.3);
    margin-top:6px;
  }
  .cart-bar .btn-main{box-shadow:none;}
  .balance-box{ text-align:center; padding:14px; }
  .balance-box .amt{ font-family:'Poppins',sans-serif; font-weight:800; font-size:38px; color:var(--navy); }
  .balance-box .amt.owe{color:#c53030;}
  .balance-box .amt.ok{color:var(--green-dark);}
  .order-row{
    background:var(--card-2);
    border-radius:10px;
    padding:10px 12px;
    margin-bottom:8px;
    font-size:13px;
    border-right:4px solid var(--navy);
  }
  .order-row.new{border-right-color:var(--green); animation:pulse 1.4s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(92,178,70,0.4);}70%{box-shadow:0 0 0 8px rgba(92,178,70,0);}100%{box-shadow:0 0 0 0 rgba(92,178,70,0);}}
  .order-row .top{display:flex;justify-content:space-between;font-weight:800;margin-bottom:4px;}
  .order-row .items{opacity:0.75;}
  .order-row .actions{margin-top:8px;display:flex;gap:8px;}
  .small{font-size:12px;opacity:0.65;}
  .empty{text-align:center;padding:30px 10px;opacity:0.55;font-size:14px;}
  .chat-box{
    display:flex;flex-direction:column;gap:8px;
    max-height:340px;overflow-y:auto;
    padding:10px 4px;margin-bottom:10px;
  }
  .chat-bubble{
    max-width:78%;
    padding:8px 12px;
    border-radius:14px;
    font-size:13.5px;
    line-height:1.5;
    word-wrap:break-word;
  }
  .chat-bubble.mine{
    align-self:flex-start;
    background:linear-gradient(135deg, var(--navy), var(--navy-deep));
    color:#fff;
    border-bottom-right-radius:4px;
  }
  .chat-bubble.theirs{
    align-self:flex-end;
    background:var(--card-2);
    border:1px solid var(--line);
    color:var(--ink);
    border-bottom-left-radius:4px;
  }
  .chat-bubble .chat-time{font-size:10px;opacity:0.6;margin-top:3px;}
  .chat-input-row{display:flex;gap:8px;align-items:center;}
  .chat-input-row input{flex:1;}
  .tab{position:relative;}
  .chat-dot{
    position:absolute; top:8px; right:calc(50% - 16px);
    width:8px;height:8px;border-radius:50%;
    background:var(--danger); box-shadow:0 0 0 2px #fff;
  }
  .toast{
    position:fixed;top:14px;left:50%;transform:translateX(-50%);
    background:var(--green-dark);color:#fff;padding:10px 18px;border-radius:30px;
    font-weight:700;font-size:13px;z-index:100;box-shadow:0 6px 18px rgba(20,51,92,0.3);
    opacity:0;pointer-events:none;transition:opacity .3s, top .3s;
  }
  .toast.show{opacity:1;top:24px;}
  .stepper{display:flex;align-items:center;gap:8px;}
  .stepper button{
    width:26px;height:26px;border-radius:6px;background:var(--navy);color:#fff;font-weight:900;font-size:15px;line-height:1;
  }
  .qty-badge{min-width:20px;text-align:center;font-weight:800;}
  table.balances{width:100%;border-collapse:collapse;font-size:13px;}
  table.balances th,table.balances td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;}
  table.balances th{color:var(--navy);}
</style>
</head>

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}
function fmt(n){ return (n<0? '-' : '') + Math.abs(n) + ' ج.م'; }
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
async function hashPass(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
// يضغط صورة اسكرين شوت التحويل ويحولها لنص base64 عشان تتخزن جوه Firestore
function fileToCompressedBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('read failed'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('image failed'));
      img.onload = ()=>{
        const maxW = 700;
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width*scale);
        canvas.height = Math.round(img.height*scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
// إرسال إيميل تنبيه للشيف بس (مش لكل الأدمنز) عند وجود طلب جديد
async function sendChefEmail(order){
  try{
    const cfg = window.EMAILJS_CONFIG;
    if(!cfg || !cfg.publicKey || cfg.publicKey.includes('ضع_') || !cfg.chefEmail || cfg.chefEmail.includes('ضع_')) return;
    if(!window.emailjs) return;
    if(!state._emailjsInit){ emailjs.init(cfg.publicKey); state._emailjsInit = true; }
    const itemsStr = order.items.map(i=>`${i.name} ×${i.qty}`).join('، ');
    await emailjs.send(cfg.serviceId, cfg.templateId, {
      to_email: cfg.chefEmail,
      order_name: order.name,
      order_items: itemsStr,
      order_total: order.kind==='drinks' ? 'مشروبات (فري)' : fmt(order.total),
      order_time: new Date(order.ts).toLocaleString('ar-EG')
    });
  }catch(e){ console.error('email send failed', e); }
}

function listenOutOfStock(cb){
  if(!firebaseReady) return ()=>{};
  return db.collection('settings').doc('outOfStock').onSnapshot(doc=>{
    cb(doc.exists ? (doc.data().ids||[]) : []);
  });
}
async function toggleStock(id){
  if(!firebaseReady) return;
  const ref = db.collection('settings').doc('outOfStock');
  await db.runTransaction(async (t)=>{
    const doc = await t.get(ref);
    const ids = doc.exists ? (doc.data().ids||[]) : [];
    const next = ids.includes(id) ? ids.filter(x=>x!==id) : [...ids, id];
    t.set(ref, {ids: next}, {merge:true});
  });
}

  if(ov.price!=null) return {...it, price: ov.price};
  return {...it, baladi: ov.baladi!=null?ov.baladi:it.baladi, fransawi: ov.fransawi!==undefined?ov.fransawi:it.fransawi};

// ---------- Data layer (Firestore) ----------
async function getBalance(name){
  if(!firebaseReady) return 0;
  try{
    const doc = await db.collection('balances').doc(name).get();
    return doc.exists ? (doc.data().value || 0) : 0;
  }catch(e){ return 0; }
}
async function addToBalance(name, delta){
  if(!firebaseReady) return;
  const ref = db.collection('balances').doc(name);
  await db.runTransaction(async (t)=>{
    const doc = await t.get(ref);
    const cur = doc.exists ? (doc.data().value || 0) : 0;
    t.set(ref, {value: cur + delta}, {merge:true});
  });
}

async function approveBalanceRequest(id){
  if(!firebaseReady) return;
  const ref = db.collection('balanceRequests').doc(id);
  const doc = await ref.get();
  if(!doc.exists || doc.data().status !== 'pending') return;
  const req = doc.data();
  await ref.update({status:'approved'});
  await addToBalance(req.name, req.kind==='charge' ? req.amount : -req.amount);
}

function render(){
  const c = document.getElementById('content');
  if(!state.name){ c.innerHTML = nameScreen(); }
  else if(state.role === 'employee' || state.role === 'admin'){
    if(state.tab === 'order') c.innerHTML = orderScreen();
    else if(state.tab === 'drinks') c.innerHTML = canSeeDrinks() ? drinksScreen() : orderScreen();
    else if(state.tab === 'balance') c.innerHTML = balanceScreen();
    else if(state.tab === 'chat') c.innerHTML = chatScreen();
    else c.innerHTML = orderScreen();
  }
  else { c.innerHTML = kitchenScreen(); }
  renderBalanceBadge();
  renderTabs();
  bindEvents();
}
function renderBalanceBadge(){
  const el = document.getElementById('balanceBadge');
  if(!el) return;
  if(state.name && (state.role==='employee' || state.role==='admin')){
    const owed = state.balance < 0;
    el.innerHTML = `<button class="balance-badge ${owed?'owe':'ok'}" data-action="tab" data-tab="balance">${owed?'⚠️':'💰'} ${fmt(Math.abs(state.balance))}</button>`;
  } else {
    el.innerHTML = '';
  }
}

function chatThreadsHtml(){
  const byEmp = {};
  (state.chatMessages||[]).forEach(m=>{
    if(!byEmp[m.employee]) byEmp[m.employee] = [];
    byEmp[m.employee].push(m);
  });
  const employees = Object.keys(byEmp).sort((a,b)=> byEmp[b][byEmp[b].length-1].ts - byEmp[a][byEmp[a].length-1].ts);
  if(employees.length===0) return `<div class="empty">لا توجد رسائل بعد</div>`;
  return employees.map(emp=>{
    const msgs = byEmp[emp];
    const last = msgs[msgs.length-1];
    const needsReply = last.sender === 'employee';
    const bubbles = msgs.slice(-12).map(m=>{
      const mine = m.sender === 'kitchen';
      const time = new Date(m.ts).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
      return `<div class="chat-bubble ${mine?'mine':'theirs'}">
        <div>${escapeHtml(m.text)}</div>
        <div class="chat-time">${time}</div>
      </div>`;
    }).join('');
    const safeId = emp.replace(/[^a-zA-Z0-9]/g,'_');
    return `
    <div class="order-row ${needsReply?'new':''}">
      <div class="top"><span>${emp}</span></div>
      <div class="chat-box" style="max-height:180px;">${bubbles}</div>
      <div class="chat-input-row">
        <input type="text" id="chatReply_${safeId}" placeholder="رد على ${emp}..." />
        <button class="btn-ghost" style="flex-shrink:0;" data-action="sendChat" data-employee="${emp}">إرسال</button>
      </div>
    </div>`;
  }).join('');
}

function adminScreen(){
  const pending = state.orders.filter(o=>o.status==='pending');

  const historyHtml = state.orders.length? state.orders.slice(0,60).map(o=>orderRow(o,false,true)).join('') : `<div class="empty">لا يوجد سجل طلبات بعد</div>`;

    <table class="balances">
      <tr><th>الاسم</th><th>الرصيد</th><th></th></tr>
      ${state.balances.map(b=>`
        <tr>
          <td>${b.name}</td>
          <td style="color:${b.value<0?'#c53030':'var(--green-dark)'};font-weight:800;">${fmt(b.value)}</td>
          <td><button class="btn-ghost" style="padding:5px 8px;font-size:11px;" data-action="topup" data-name="${b.name}">تسجيل دفعة</button></td>
        </tr>`).join('')}
    </table>` : `<div class="empty">لا توجد أرصدة مسجلة بعد</div>`;
  // إجمالي المبيعات: بس الأصناف اللي بفلوس (مش المشروبات الفري) — إجمالي / اليوم / الشهر
  const paidOrders = state.orders.filter(o=>o.kind!=='drinks');
  const now = new Date();
  const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  const totalSales = paidOrders.reduce((s,o)=>s+o.total,0);
  const todayOrders = paidOrders.filter(o=>o.ts>=startOfDay);
  const todaySales = todayOrders.reduce((s,o)=>s+o.total,0);
  const monthSales = paidOrders.filter(o=>o.ts>=startOfMonth).reduce((s,o)=>s+o.total,0);
  const todayByMethod = {balance:0, cash:0, instapay:0};
  todayOrders.forEach(o=>{ todayByMethod[o.paymentMethod] = (todayByMethod[o.paymentMethod]||0) + o.total; });
  const salesHtml = `
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">
      <div class="balance-box" style="padding:8px;"><div class="small">النهاردة</div><div class="amt ok">${fmt(todaySales)}</div></div>
      <div class="balance-box" style="padding:8px;"><div class="small">الشهر ده</div><div class="amt ok">${fmt(monthSales)}</div></div>
      <div class="balance-box" style="padding:8px;"><div class="small">إجمالي كل الوقت</div><div class="amt ok">${fmt(totalSales)}</div></div>
    </div>
    <div class="small" style="margin-top:10px;font-weight:700;">تفصيل فلوس النهاردة حسب وسيلة الدفع</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:6px;">
      <div class="balance-box" style="padding:8px;"><div class="small">💳 من الرصيد</div><div class="amt ok">${fmt(todayByMethod.balance)}</div></div>
      <div class="balance-box" style="padding:8px;"><div class="small">💵 كاش</div><div class="amt ok">${fmt(todayByMethod.cash)}</div></div>
      <div class="balance-box" style="padding:8px;"><div class="small">📲 إنستاباي</div><div class="amt ok">${fmt(todayByMethod.instapay)}</div></div>
    </div>`;
  // دفعات كاش لسه مستلمتش الفلوس عنها
  const unpaidCash = state.orders.filter(o=>o.kind!=='drinks' && o.paymentMethod==='cash' && !o.paymentConfirmed);
  const unpaidCashHtml = unpaidCash.length? unpaidCash.map(o=>orderRow(o,false,true)).join('') : `<div class="empty">مفيش دفعات كاش معلّقة</div>`;
  // طلبات شحن/سحب رصيد محتاجة موافقة
  const pendingBalanceReqs = state.balanceRequests||[];
  const balanceReqsHtml = pendingBalanceReqs.length? pendingBalanceReqs.map(r=>`
    <div class="order-row">
      <div class="top"><span>${r.name}</span><span>${r.kind==='charge'?'شحن':'سحب'} ${fmt(r.amount)}</span></div>
      <div class="small">${r.kind==='charge'?'حوّل من':'يستلم على'}: ${r.phone}</div>
      ${r.screenshot? `<img src="${r.screenshot}" style="max-width:120px;border-radius:8px;margin-top:6px;cursor:pointer;" onclick="window.open(this.src)" />`:''}
      <div class="actions"><button class="btn-ghost" data-action="approveBalanceRequest" data-id="${r.id}">قبول الطلب ✓</button></div>
    </div>`).join('') : `<div class="empty">لا توجد طلبات رصيد معلّقة</div>`;
  // سجل كل موظف: عدد الطلبات، إجمالي المبلغ (النهاردة/الشهر/كل الوقت)، والأصناف اللي طلبها
  const byEmployee = {};
  paidOrders.forEach(o=>{
    if(!byEmployee[o.name]) byEmployee[o.name] = {total:0, today:0, month:0, count:0, items:{}};
    byEmployee[o.name].total += o.total;
    if(o.ts>=startOfDay) byEmployee[o.name].today += o.total;
    if(o.ts>=startOfMonth) byEmployee[o.name].month += o.total;
    byEmployee[o.name].count += 1;
    o.items.forEach(i=>{
      byEmployee[o.name].items[i.name] = (byEmployee[o.name].items[i.name]||0) + i.qty;
    });
  });
  const employeeNames = Object.keys(byEmployee).sort((a,b)=>byEmployee[b].total-byEmployee[a].total);
  const employeeLedgerHtml = employeeNames.length? `
    <table class="balances">
      <tr><th>الاسم</th><th>عدد الطلبات</th><th>النهاردة</th><th>الشهر ده</th><th>كل الوقت</th><th>الأصناف</th></tr>
      ${employeeNames.map(name=>{
        const e = byEmployee[name];
        const itemsStr = Object.keys(e.items).map(n=>`${n} ×${e.items[n]}`).join('، ');
        return `<tr>
          <td>${name}</td>
          <td>${e.count}</td>
          <td style="font-weight:800;">${fmt(e.today)}</td>
          <td style="font-weight:800;">${fmt(e.month)}</td>
          <td style="font-weight:800;">${fmt(e.total)}</td>
          <td class="small">${itemsStr}</td>
        </tr>`;
      }).join('')}
    </table>` : `<div class="empty">لا يوجد سجل طلبات مدفوعة بعد</div>`;
  return `
  <div class="card" style="display:flex;justify-content:space-between;align-items:center;">
    <div><div class="small">لوحة التحكم</div><div style="font-weight:900;font-size:16px;">${state.name}</div></div>
    <button class="btn-ghost" data-action="switchUser">تغيير المستخدم</button>
  </div>
  ${balanceCardWithActions()}
  <div class="card"><h2>💱 طلبات شحن/سحب الرصيد</h2><p class="small" style="margin-top:-6px;">راجع وأكّد طلبات الموظفين لشحن أو سحب رصيدهم</p>${balanceReqsHtml}</div>
  <div class="card"><h2>📊 إجمالي المبيعات</h2>${salesHtml}</div>
  <div class="card"><h2>💵 دفعات كاش محتاجة تأكيد</h2><p class="small" style="margin-top:-6px;">دوس "تأكيد استلام الفلوس" بعد ما توصلك الفلوس فعليًا</p>${unpaidCashHtml}</div>
  <div class="card"><h2>👤 سجل كل موظف</h2><p class="small" style="margin-top:-6px;">إجمالي كل حد وإيه اللي طلبه (الأصناف المدفوعة بس)</p>${employeeLedgerHtml}</div>
  <div class="card"><h2>🔔 الطلبات الجديدة</h2>${ordersHtml}</div>
  <div class="card"><h2>📜 سجل كل الطلبات</h2><p class="small" style="margin-top:-6px;">آخر 60 طلب، الأحدث أولًا</p>${historyHtml}</div>
  <div class="card"><h2>💰 الأرصدة</h2>${balancesHtml}</div>
  <div class="card"><h2>📦 إدارة المخزون والأصناف</h2><p class="small" style="margin-top:-6px;">أوقف أي صنف عشان محدش يقدر يطلبه، أو ضيف صنف جديد</p>${stockManagementHtml()}</div>`;
}
function orderRow(o, isPending, isAdminView){
  const itemsStr = o.items.map(i=> i.type ? `${i.name} (${i.type==='baladi'?'بلدي':'فرنساوي'}) ×${i.qty}` : `${i.name} ×${i.qty}`).join('، ');
  const time = new Date(o.ts).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
  const isDrinks = o.kind === 'drinks';
  const payLabel = o.paymentMethod==='cash'? '💵 كاش' : o.paymentMethod==='instapay' ? '📲 إنستاباي' : '💳 رصيد';
  const payBadge = !isDrinks ? payLabel : '';
  const instapayInfo = (!isDrinks && o.paymentMethod==='instapay') ? `
    <div class="small" style="margin-top:6px;">حوّل من: ${o.instapaySender||''}</div>
    ${o.instapayScreenshot? `<img src="${o.instapayScreenshot}" style="max-width:120px;border-radius:8px;margin-top:6px;cursor:pointer;" onclick="window.open(this.src)" />`:''}` : '';
  const needsPaymentConfirm = isAdminView && !isDrinks && o.paymentMethod==='cash' && !o.paymentConfirmed;
  const paymentBadge = (!isDrinks && o.paymentMethod==='cash') ? `
    <div class="small" style="margin-top:4px;color:${o.paymentConfirmed?'var(--green-dark)':'#c53030'};font-weight:700;">${o.paymentConfirmed? '✓ الفلوس استلمت':'⏳ لسه مستلمتش الفلوس'}</div>` : '';
  const noteHtml = o.note ? `<div class="small" style="margin-top:6px;background:var(--card-2);border-radius:8px;padding:6px 10px;">📝 ${o.note}</div>` : '';
  return `
  <div class="order-row ${isPending && !state.seenOrderIds.has(o.id) ? 'new':''}">
    <div class="top"><span>${o.name} ${isDrinks? '☕':''}</span><span>${isDrinks? 'مشروبات' : fmt(o.total)}</span></div>
    <div class="items">${itemsStr}</div>
    <div class="small">${time}${payBadge? ' · '+payBadge : ''}</div>
    ${paymentBadge}
    ${noteHtml}
    ${instapayInfo}
    <div class="actions">
      ${isPending? `<button class="btn-ghost" data-action="markDone" data-id="${o.id}">تم التجهيز ✓</button>`:''}
      ${needsPaymentConfirm? `<button class="btn-ghost" data-action="confirmPayment" data-id="${o.id}">تأكيد استلام الفلوس 💵</button>`:''}
    </div>
  </div>`;
}
function renderTabs(){

  if(!state.role || !state.name){ tb.innerHTML=''; return; }
  if(state.role==='employee' || state.role==='admin'){
    tb.innerHTML = `
      <button class="tab ${state.tab==='order'?'active':''}" data-action="tab" data-tab="order"><span class="ic">🍽️</span>بوفيه وسناكس</button>
      ${canSeeDrinks()? `<button class="tab ${state.tab==='drinks'?'active':''}" data-action="tab" data-tab="drinks"><span class="ic">☕</span>مشروبات</button>`:''}
      <button class="tab ${state.tab==='balance'?'active':''}" data-action="tab" data-tab="balance"><span class="ic">💰</span>رصيدي</button>
      <button class="tab ${state.tab==='chat'?'active':''}" data-action="tab" data-tab="chat"><span class="ic">💬</span>شات ضياء${state.chatUnread? '<span class="chat-dot"></span>':''}</button>`;
  } else {
    tb.innerHTML = `<button class="tab active"><span class="ic">🍳</span>لوحة المطبخ</button>`;

function bindEvents(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    el.onclick = async ()=>{
      const action = el.dataset.action;
      if(action==='doLogin'){ await doLogin(); }
      else if(action==='switchUser'){
        state.name=''; state.role=null; state.cart={}; state.drinkCart={}; state.snackCart={}; state.isAdmin=false; state.topupMode=null;
        clearSession();
        if(state._unsubOrders){ state._unsubOrders(); state._unsubOrders=null; }
        if(state._unsubBalances){ state._unsubBalances(); state._unsubBalances=null; }
        if(state._unsubStock){ state._unsubStock(); state._unsubStock=null; }
        if(state._unsubCustomItems){ state._unsubCustomItems(); state._unsubCustomItems=null; }
        if(state._unsubPrices){ state._unsubPrices(); state._unsubPrices=null; }
        if(state._unsubBalanceRequests){ state._unsubBalanceRequests(); state._unsubBalanceRequests=null; }
        if(state._unsubChat){ state._unsubChat(); state._unsubChat=null; }
        state.chatMessages = []; state.chatUnread = false; state.hasChatPolledOnce = false;
        render();
      }
      else if(action==='setPayment'){ state.paymentMethod = el.dataset.method; render(); }
      else if(action==='copyInstapay'){
        try{
          await navigator.clipboard.writeText(INSTAPAY_NUMBER);
          toast('تم نسخ الرقم ✅');
        }catch(e){
          // fallback لو المتصفح مش داعم نسخ مباشر (زي بعض متصفحات الموبايل القديمة)
          try{
            const ta = document.createElement('textarea');
            ta.value = INSTAPAY_NUMBER;
            ta.style.position='fixed'; ta.style.opacity='0';
            document.body.appendChild(ta);
            ta.focus(); ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            toast('تم نسخ الرقم ✅');
          }catch(e2){
            toast('اضغط مطولًا على الرقم وانسخه يدويًا');
          }
        }
      }
      else if(action==='pick'){
        const id = el.dataset.id, type = el.dataset.type;
        if(!state.cart[id]) state.cart[id] = {type, qty:1};
        else state.cart[id].type = type;
        render();
      }
      else if(action==='inc'){ state.cart[el.dataset.id].qty++; render(); }
      else if(action==='dec'){
        const id = el.dataset.id;
        state.cart[id].qty--;
        if(state.cart[id].qty<=0) delete state.cart[id];
        render();
      }
      else if(action==='confirmOrder'){ await submitOrder(); }
      else if(action==='incDrink'){
        const id = el.dataset.id;
        if(!state.drinkCart[id]) state.drinkCart[id] = {qty:1};
        else state.drinkCart[id].qty++;
        render();
      }
      else if(action==='decDrink'){
        const id = el.dataset.id;
        state.drinkCart[id].qty--;
        if(state.drinkCart[id].qty<=0) delete state.drinkCart[id];
        render();
      }
      else if(action==='confirmDrinkOrder'){ await submitDrinkOrder(); }
      else if(action==='tab'){
        state.tab = el.dataset.tab;
        if(state.tab==='chat') state.chatUnread = false;
        render();
        if(state.tab==='balance') refreshMyOrders();
        if(state.tab==='chat') scrollChatToBottom();
      }
      else if(action==='sendChat'){ await handleSendChat(el.dataset.employee); }
      else if(action==='markDone'){ await markOrderDone(el.dataset.id); }
      else if(action==='savePrice'){ await handleSavePrice(el.dataset.id, el.dataset.mode); }
      else if(action==='confirmPayment'){ await confirmPayment(el.dataset.id); }
      else if(action==='toggleStock'){ await toggleStock(el.dataset.id); }
      else if(action==='openTopup'){ state.tab='balance'; state.topupMode='charge'; render(); }
      else if(action==='openWithdraw'){ state.tab='balance'; state.topupMode='withdraw'; render(); }
      else if(action==='closeTopup'){ state.topupMode=null; render(); }
      else if(action==='submitBalanceRequest'){ await handleSubmitBalanceRequest(); }
      else if(action==='approveBalanceRequest'){ await approveBalanceRequest(el.dataset.id); }
      else if(action==='incSnack'){
        const id = el.dataset.id;
        if(!state.snackCart[id]) state.snackCart[id] = {qty:1};
        else state.snackCart[id].qty++;
        render();
      }
      else if(action==='decSnack'){
        const id = el.dataset.id;
        state.snackCart[id].qty--;
        if(state.snackCart[id].qty<=0) delete state.snackCart[id];
        render();
      }
      else if(action==='confirmSnackOrder'){ await submitOrder(); }
      else if(action==='addMenuItem'){ await handleAddMenuItem(); }
      else if(action==='deleteItem'){
        if(confirm('متأكد إنك عايز تحذف الصنف ده؟')) await deleteCustomItem(el.dataset.id);
      }
      else if(action==='topup'){
        const name = el.dataset.name;
        const amt = prompt('قيمة الدفعة (ج.م) لـ '+name+':');
        if(amt && !isNaN(amt) && parseFloat(amt)>0){
          await addToBalance(name, parseFloat(amt));
          toast('تم تسجيل الدفعة بنجاح');
        }
      }
    };
  });
}
async function afterLogin(){
  if(state.role==='employee' || state.role==='admin'){ state.balance = await getBalance(state.name); }
  render();
  if(state.role==='employee' || state.role==='admin') refreshMyOrders();
  if(state.role==='employee' || state.role==='admin'){
    if(!state._unsubChat) state._unsubChat = listenMyChat(state.name, onMyChatUpdate);
  }
  if(state.role==='kitchen'){
    if(!state._unsubOrders) state._unsubOrders = listenOrders(onOrdersUpdate);
    if(!state._unsubBalances) state._unsubBalances = listenBalances(onBalancesUpdate);
    if(!state._unsubBalanceRequests) state._unsubBalanceRequests = listenPendingBalanceRequests(reqs=>{
      const prevIds = new Set((state.balanceRequests||[]).map(r=>r.id));
      const fresh = reqs.filter(r=>!prevIds.has(r.id) && state.hasBalanceReqPolledOnce);
      state.balanceRequests = reqs;
      state.hasBalanceReqPolledOnce = true;
      if(fresh.length>0 && state.kitchenUnlocked){
        toast('طلب رصيد جديد');
        playBeep();
        const r = fresh[0];
        notifyKitchen('طلب رصيد جديد 💳', r.name + ' - ' + (r.type==='withdraw'?'سحب':'شحن') + ' ' + fmt(r.amount||0));
      }
      render();
    });
    if(!state._unsubChat) state._unsubChat = listenAllChat(onKitchenChatUpdate);
  }
  if(state.role==='kitchen'){ state.kitchenUnlocked = true; prepAlerts(); }
  if(!state._unsubStock) state._unsubStock = listenOutOfStock(ids=>{ state.outOfStock = new Set(ids); render(); });
  if(!state._unsubCustomItems) state._unsubCustomItems = listenCustomItems((menuItems, snackItems, drinkItems)=>{
    state.customMenu = menuItems; state.customSnacks = snackItems; state.customDrinks = drinkItems; render();
  });
  if(!state._unsubPrices) state._unsubPrices = listenPriceOverrides(ov=>{ state.priceOverrides = ov; render(); });
}
async function doLogin(){
  const u = document.getElementById('userInput').value.trim();
  const p = document.getElementById('passInput').value;
  if(!u || !p){ toast('يرجى إدخال الإيميل وكلمة المرور'); return; }
  if(!/^[^\s@]+@evraid\.com$/i.test(u)){ toast('لازم تسجل بإيميل بصيغة اسم@evraid.com'); return; }
  if(p.length < 4){ toast('كلمة المرور لازم تكون 4 حروف على الأقل'); return; }
  if(!isAllowedEmail(u)){ toast('هذا الإيميل غير مصرح له بالدخول'); return; }
  if(!firebaseReady){ toast('يجب إعداد بيانات Firebase أولًا'); return; }
  try{ localStorage.setItem('evraid_last_email', u); }catch(e){}
  try{
    const ref = db.collection('users').doc(u);
    const doc = await ref.get();
    const hashed = await hashPass(p);
    if(doc.exists){
      if(doc.data().password !== hashed){
        toast('كلمة المرور غير صحيحة');
        return;
      }
    } else {
      await ref.set({password: hashed, createdAt: Date.now()});
      toast('تم إنشاء الحساب بنجاح');
    }
    state.name = u;
    state.role = roleForEmail(u);
    state.isAdmin = state.role === 'admin';
    saveSession();
    await afterLogin();
  }catch(e){ toast('حدث خطأ أثناء تسجيل الدخول'); }
}
async function buildInstapayFields(){
  if(state.paymentMethod !== 'instapay') return {ok:true, extra:{}};
  const phoneEl = document.getElementById('instapayPhoneInput');
  const fileEl = document.getElementById('instapayFileInput');
  const phone = phoneEl ? phoneEl.value.trim() : '';
  const file = fileEl && fileEl.files ? fileEl.files[0] : null;
  if(!phone){ toast('يرجى كتابة الرقم اللي حوّلت منه'); return {ok:false}; }
  if(!/^[0-9]{11}$/.test(phone)){ toast('الرقم لازم يكون أرقام بس ومكوّن من 11 رقم'); return {ok:false}; }
  if(!file){ toast('يرجى إرفاق اسكرين شوت التحويل'); return {ok:false}; }
  try{
    const screenshot = await fileToCompressedBase64(file);
    return {ok:true, extra:{instapaySender: phone, instapayScreenshot: screenshot}};
  }catch(e){ toast('تعذر قراءة الصورة، حاول تاني'); return {ok:false}; }
}
async function handleSavePrice(id, mode){
  try{
    if(mode==='snack'){
      const priceEl = document.getElementById('price_'+id);
      const price = Number(priceEl.value);
      if(!price || price<=0){ toast('اكتب سعر صحيح'); return; }
      await setPriceOverride(id, {price});
    } else {
      const bEl = document.getElementById('baladi_'+id);
      const fEl = document.getElementById('fransawi_'+id);
      const baladi = bEl.value ? Number(bEl.value) : null;
      const fransawi = fEl.value ? Number(fEl.value) : null;
      if(!baladi && !fransawi){ toast('اكتب سعر واحد على الأقل'); return; }
      await setPriceOverride(id, {baladi, fransawi});
    }
    toast('تم حفظ السعر');
  }catch(e){ toast('حدث خطأ أثناء الحفظ'); }
}
async function handleSubmitBalanceRequest(){
  const kindBtn = document.querySelector('[data-action="submitBalanceRequest"]');
  const kind = kindBtn ? kindBtn.dataset.kind : state.topupMode;
  const amountEl = document.getElementById('balanceReqAmount');
  const phoneEl = document.getElementById('balanceReqPhone');
  const amount = amountEl ? Number(amountEl.value) : NaN;
  const phone = phoneEl ? phoneEl.value.trim() : '';
  if(!amount || amount<=0){ toast('اكتب مبلغ صحيح'); return; }
  if(!/^[0-9]{11}$/.test(phone)){ toast('الرقم لازم يكون أرقام بس ومكوّن من 11 رقم'); return; }
  let screenshot = null;
  if(kind==='charge'){
    const fileEl = document.getElementById('balanceReqFile');
    const file = fileEl && fileEl.files ? fileEl.files[0] : null;
    if(!file){ toast('يرجى إرفاق صورة إثبات التحويل'); return; }
    try{ screenshot = await fileToCompressedBase64(file); }
    catch(e){ toast('تعذر قراءة الصورة، حاول تاني'); return; }
  }
  const req = {
    id: 'breq_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    name: state.name, kind, amount, phone, screenshot, status:'pending', ts: Date.now()
  };

    await saveBalanceRequest(req);
    state.topupMode = null;
    toast('تم إرسال الطلب، بانتظار المراجعة');

}
async function handleAddMenuItem(){
  const catEl = document.getElementById('newItemCat');
  const nameEl = document.getElementById('newItemName');
  const priceEl = document.getElementById('newItemPrice');
  const cat = catEl ? catEl.value : 'menu';
  const name = nameEl ? nameEl.value.trim() : '';
  if(!name){ toast('اكتب اسم الصنف'); return; }
  const item = {
    id: 'custom_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
    name, addedAt: Date.now(),
  };
  if(cat==='drinks'){
    item.kind='drinks';
  } else {
    const price = priceEl ? Number(priceEl.value) : NaN;
    if(!price || price<=0){ toast('اكتب سعر صحيح'); return; }

    else { item.price = price; item.kind='snack'; }
  }
  try{
    await addCustomItem(item);
    toast('تم إضافة الصنف');

  }catch(e){ toast('حدث خطأ أثناء الإضافة'); }

async function submitOrder(){
  if(Object.keys(state.cart).length===0 && Object.keys(state.snackCart).length===0) return;
  if(!firebaseReady){ toast('يجب إعداد بيانات Firebase أولًا'); return; }
  const items = []; let total = 0;
  for(const id in state.cart){
    const it = allMenuItems().find(m=>m.id===id);
    const c = state.cart[id];
    const price = c.type==='baladi'? it.baladi : it.fransawi;
    items.push({name:it.name, type:c.type, qty:c.qty, price});
    total += price*c.qty;
  }
  for(const id in state.snackCart){
    const s = allSnackItems().find(m=>m.id===id);
    const c = state.snackCart[id];
    items.push({name:s.name, qty:c.qty, price:s.price});
    total += s.price*c.qty;
  }
  const method = state.paymentMethod === 'cash' ? 'cash' : (state.paymentMethod==='instapay' ? 'instapay' : 'balance');
  const ip = await buildInstapayFields();
  if(!ip.ok) return;
  const noteEl = document.getElementById('orderNote');
  const note = noteEl ? noteEl.value.trim() : '';
  const order = {
    id: 'order_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    name: state.name, items, total, paymentMethod: method, paymentConfirmed: method !== 'cash', ts: Date.now(), status: 'pending', note, ...ip.extra
  };
  try{
    await saveOrder(order);
    if(method === 'balance'){
      await addToBalance(state.name, -total);
      state.balance = state.balance - total;
    }
    state.cart = {};
    state.snackCart = {};
    toast(method==='cash' ? 'تم إرسال الطلب — الدفع كاش عند الاستلام' : method==='instapay' ? 'تم إرسال الطلب — بانتظار تأكيد التحويل' : 'تم إرسال الطلب إلى المطبخ');
    render();
    sendChefEmail(order);
  }catch(e){ toast('حدث خطأ، يرجى المحاولة مرة أخرى'); }
}
async function submitDrinkOrder(){
  if(Object.keys(state.drinkCart).length===0) return;
  if(!firebaseReady){ toast('يجب إعداد بيانات Firebase أولًا'); return; }
  const items = [];
  for(const id in state.drinkCart){
    const d = allDrinksItems().find(m=>m.id===id);
    items.push({name:d.name, qty:state.drinkCart[id].qty, price:0});
  }
  const noteEl = document.getElementById('drinkOrderNote');
  const note = noteEl ? noteEl.value.trim() : '';
  const order = {
    id: 'order_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    name: state.name, items, total: 0, kind:'drinks', ts: Date.now(), status: 'pending', note
  };
  try{
    await saveOrder(order);
    state.drinkCart = {};
    toast('تم إرسال طلب المشروبات إلى المطبخ');
    render();
    sendChefEmail(order);
  }catch(e){ toast('حدث خطأ، يرجى المحاولة مرة أخرى'); }
}
async function handleSendChat(employeeDataset){
  const isKitchenReply = !!employeeDataset;
  const employee = isKitchenReply ? employeeDataset : state.name;
  const inputId = isKitchenReply ? 'chatReply_'+employee.replace(/[^a-zA-Z0-9]/g,'_') : 'chatInput';
  const inputEl = document.getElementById(inputId);
  const text = inputEl ? inputEl.value.trim() : '';
  if(!text) return;
  if(!firebaseReady){ toast('يجب إعداد بيانات Firebase أولًا'); return; }
  const sender = state.role==='kitchen' ? 'kitchen' : 'employee';
  try{
    if(inputEl) inputEl.value = '';
    await sendChatMsg(employee, sender, text);
  }catch(e){ toast('حدث خطأ أثناء إرسال الرسالة'); }
}
function scrollChatToBottom(){
  setTimeout(()=>{ const box = document.getElementById('chatBox'); if(box) box.scrollTop = box.scrollHeight; }, 60);
}
function onMyChatUpdate(msgs){
  const prevIds = new Set(state.chatMessages.map(m=>m.id));
  const incomingKitchen = msgs.filter(m=>m.sender==='kitchen' && !prevIds.has(m.id) && state.hasChatPolledOnce);
  state.chatMessages = msgs;
  if(incomingKitchen.length>0){
    if(state.tab!=='chat'){ state.chatUnread = true; }
    toast('رسالة جديدة من ضياء 💬');
  }
  state.hasChatPolledOnce = true;
  if(state.role==='employee' || state.role==='admin') render();
  if(state.tab==='chat') scrollChatToBottom();
}
function onKitchenChatUpdate(msgs){
  const prevIds = new Set(state.chatMessages.map(m=>m.id));
  const incomingEmployee = msgs.filter(m=>m.sender==='employee' && !prevIds.has(m.id) && state.hasChatPolledOnce);
  state.chatMessages = msgs;
  if(incomingEmployee.length>0 && state.kitchenUnlocked){
    toast('رسالة جديدة 💬');
    playBeep();
    const m = incomingEmployee[0];
    notifyKitchen('رسالة جديدة من ' + (m.employee||'موظف') + ' 💬', m.text||'');
  }
  state.hasChatPolledOnce = true;
  if(state.kitchenUnlocked) render();
}
async function refreshMyOrders(){
  const el = document.getElementById('myOrdersList');
  if(!el || !firebaseReady) { if(el) el.innerHTML = `<div class="empty">ستظهر الطلبات هنا بعد إعداد Firebase</div>`; return; }
  db.collection('orders').where('name','==',state.name).orderBy('ts','desc').limit(8).get().then(snap=>{
    const mine = snap.docs.map(d=>d.data());
    if(mine.length===0){ el.innerHTML = `<div class="empty">لم يتم تقديم أي طلب بعد</div>`; return; }
    el.innerHTML = mine.map(o=>{
      const itemsStr = o.items.map(i=>`${i.name} ×${i.qty}`).join('، ');
      const time = new Date(o.ts).toLocaleString('ar-EG',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'numeric'});
      const label = o.kind==='drinks' ? 'مشروبات ☕' : fmt(o.total);
      return `<div class="order-row"><div class="top"><span>${label}</span><span>${o.status==='done'?'✅ جاهز':'⏳ قيد التحضير'}</span></div><div class="items">${itemsStr}</div><div class="small">${time}</div></div>`;
    }).join('');
  }).catch(()=>{ el.innerHTML = `<div class="empty">تعذر تحميل الطلبات</div>`; });
}
function prepAlerts(){
  try{ if(window.Notification && Notification.permission==='default'){ Notification.requestPermission(); } }catch(e){}
  try{
    if(!state._audioCtx){ state._audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    if(state._audioCtx.state === 'suspended'){ state._audioCtx.resume(); }
  }catch(e){}
}
// إشعار حقيقي لضياء بس، عن طريق الـ Service Worker لو متاح (بيشتغل حتى لو الشاشة مش فاتحة قدامه)
// وبيرجع لطريقة Notification العادية لو الـ Service Worker مش جاهز.
function notifyKitchen(title, body){
  if(state.role!=='kitchen' || !state.kitchenUnlocked) return;
  try{
    if(!window.Notification || Notification.permission!=='granted') return;
    if(navigator.serviceWorker && navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(reg=>{
        reg.showNotification(title, {body, icon:'./icon-192.png', badge:'./icon-192.png', tag:title+Date.now()});
      }).catch(()=>{ try{ new Notification(title, {body}); }catch(e){} });
    } else {
      new Notification(title, {body});
    }
  }catch(e){}
}
function playBeep(){
  try{
    const ctx = state._audioCtx;
    if(!ctx) return;
    const beepOnce = (delay)=>{
      setTimeout(()=>{
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.4, ctx.currentTime+0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.35);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime+0.4);
      }, delay);
    };
    beepOnce(0); beepOnce(450);
  }catch(e){}
}
function onOrdersUpdate(orders){
  const prevPendingIds = new Set(state.orders.filter(o=>o.status==='pending').map(o=>o.id));
  const newPending = orders.filter(o=>o.status==='pending' && !prevPendingIds.has(o.id) && state.hasPolledOnce);
  state.orders = orders;
  const isKitchenDevice = state.role==='kitchen' && state.kitchenUnlocked;
  if(newPending.length>0 && isKitchenDevice){
    toast('تم استلام طلب جديد');
    playBeep();
    notifyKitchen('طلب جديد 🧾', newPending[0].name + ' - ' + (newPending[0].kind==='drinks' ? 'مشروبات' : fmt(newPending[0].total||0)));
  }
  state.hasPolledOnce = true;
  if(isKitchenDevice || state.role==='admin') render();
}
function onBalancesUpdate(balances){
  state.balances = balances;
  if((state.role==='kitchen' && state.kitchenUnlocked) || state.role==='admin') render();
}

// استرجاع الجلسة المحفوظة (لو المستخدم سجل دخول قبل كده على نفس الجهاز)
(function restoreSession(){
  const saved = loadSession();
  if(saved && saved.name && saved.role && firebaseReady){
    state.name = saved.name;
    state.role = roleForEmail(saved.name);
    state.isAdmin = state.role === 'admin';
    afterLogin();
  }
})();

render();
</script>
