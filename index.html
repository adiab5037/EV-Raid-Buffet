<script>
// ---------- Firebase setup ----------
let db = null;
let firebaseReady = false;
try{
  if(window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.apiKey && !window.FIREBASE_CONFIG.apiKey.includes('ضع_')){
    firebase.initializeApp(window.FIREBASE_CONFIG);

}catch(e){ console.error('Firebase init failed', e); }

if(!firebaseReady){

    <div class="warn-banner">
      <b>خطوة أخيرة مطلوبة:</b> يرجى إدخال بيانات إعداد Firebase في أول ملف index.html
      (موضّح مكانها بتعليق أعلى الملف)، حتى يتم حفظ الطلبات والأرصدة ومزامنتها بين جميع المستخدمين.
      وحتى إتمام هذه الخطوة، يعمل التطبيق دون حفظ فعلي للبيانات.
    </div>`;
}

// ---------- PWA install ----------
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
}
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  const area = document.getElementById('installArea');
  area.innerHTML = `<button class="install-btn" id="installBtn">⬇️ تثبيت التطبيق على الشاشة الرئيسية</button>`;
  document.getElementById('installBtn').onclick = async ()=>{
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    area.innerHTML = '';

});

// ---------- App state & data ----------
const MENU = [
  {id:'roumy', name:'جبنة رومي', baladi:15, fransawi:20},
  {id:'tomato_cheese', name:'جبنة بالطماطم', baladi:12, fransawi:15},
  {id:'cheddar', name:'جبنة شيدر', baladi:25, fransawi:30},
  {id:'luncheon', name:'لانشون', baladi:15, fransawi:20},
  {id:'salad', name:'سلطة خضراء', baladi:30, fransawi:null},

  {id:'egg_cheddar', name:'بيض (شيدر)', baladi:25, fransawi:30},
  {id:'egg_roumy', name:'بيض (رومي)', baladi:25, fransawi:30},
  {id:'egg_basterma', name:'بيض (بسطرمة)', baladi:30, fransawi:35},
  {id:'sicilians', name:'سكلانس', baladi:25, fransawi:30},
];

// سناكس بسعر ثابت للقطعة
const SNACKS = [
  {id:'mcvities', name:'بسكويت ماكفيز', price:10},
  {id:'oreo', name:'أوريو', price:10},
  {id:'mandolin', name:'ماندولين', price:10},
  {id:'ulker', name:'أولكر', price:10},
  {id:'molto_magnum', name:'مولتو ماجنم', price:15},
];

const DRINKS = [
  {id:'tea', name:'شاي'},
  {id:'anise', name:'ينسون'},
  {id:'karkade', name:'كركديه'},
  {id:'coffee', name:'قهوة'},
  {id:'latte', name:'لاتيه'},
  {id:'macchiato', name:'ماكياتو'},
  {id:'espresso', name:'إسبريسو'},
  {id:'cappuccino', name:'كابتشينو'},
  {id:'ice_coffee', name:'آيس كوفي'},
];

// ============================================================
// غيّر السطر ده لإيميل/يوزر نيم الأدمن اللي هيدخل بيه (حساس لحالة الأحرف؟ لأ)
const ADMIN_EMAIL = "admin@evraid.com";
// رقم الإنستاباي اللي هيظهر للموظف عشان يحول عليه
const INSTAPAY_NUMBER = "ضع_رقم_الانستاباي_هنا";
// أسماء المستخدمين (زي ما بيكتبوها بالظبط وقت تسجيل الدخول) اللي مسموحلهم بس يشوفوا تاب المشروبات
const DRINKS_ALLOWED = ["اسم_المدير_1", "اسم_المدير_2", "اسم_المدير_3"];
function canSeeDrinks(){
  return DRINKS_ALLOWED.map(n=>n.trim().toLowerCase()).includes((state.name||'').trim().toLowerCase());
}
// ============================================================

let state = {
  tab: 'order', name: '', role: null, isAdmin: false,
  cart: {}, drinkCart: {}, snackCart: {}, balance: 0, paymentMethod: 'balance',
  orders: [], balances: [],
  outOfStock: new Set(),
  customMenu: [], customSnacks: [],
  seenOrderIds: new Set(),
  kitchenUnlocked: false,
  hasPolledOnce: false,
  _unsubOrders: null, _unsubBalances: null, _unsubStock: null, _unsubCustomItems: null,
  _audioCtx: null,
};

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}
function fmt(n){ return (n<0? '-' : '') + Math.abs(n) + ' ج.م'; }
async function hashPass(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
// يضغط صورة اسكرين شوت التحويل ويحولها لنص base64 عشان تتخزن جوه Firestore
function fileToCompressedBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('read failed'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('image failed'));
      img.onload = ()=>{
        const maxW = 700;
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width*scale);
        canvas.height = Math.round(img.height*scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
// إرسال إيميل تنبيه للشيف بس (مش لكل الأدمنز) عند وجود طلب جديد
async function sendChefEmail(order){
  try{
    const cfg = window.EMAILJS_CONFIG;
    if(!cfg || !cfg.publicKey || cfg.publicKey.includes('ضع_') || !cfg.chefEmail || cfg.chefEmail.includes('ضع_')) return;
    if(!window.emailjs) return;
    if(!state._emailjsInit){ emailjs.init(cfg.publicKey); state._emailjsInit = true; }
    const itemsStr = order.items.map(i=>`${i.name} ×${i.qty}`).join('، ');
    await emailjs.send(cfg.serviceId, cfg.templateId, {
      to_email: cfg.chefEmail,
      order_name: order.name,
      order_items: itemsStr,
      order_total: order.kind==='drinks' ? 'مشروبات (فري)' : fmt(order.total),
      order_time: new Date(order.ts).toLocaleString('ar-EG')
    });
  }catch(e){ console.error('email send failed', e); }
}
// إدارة الأصناف "أوت أوف ستوك"
function listenOutOfStock(cb){
  if(!firebaseReady) return ()=>{};
  return db.collection('settings').doc('outOfStock').onSnapshot(doc=>{
    cb(doc.exists ? (doc.data().ids||[]) : []);
  });
}
async function toggleStock(id){
  if(!firebaseReady) return;
  const ref = db.collection('settings').doc('outOfStock');
  await db.runTransaction(async (t)=>{
    const doc = await t.get(ref);
    const ids = doc.exists ? (doc.data().ids||[]) : [];
    const next = ids.includes(id) ? ids.filter(x=>x!==id) : [...ids, id];
    t.set(ref, {ids: next}, {merge:true});
  });
}
// أصناف يضيفها الأدمن من التطبيق نفسه (بوفيه أو سناكس)
function listenCustomItems(cb){
  if(!firebaseReady) return ()=>{};
  return db.collection('menuItems').onSnapshot(snap=>{
    const all = snap.docs.map(d=>d.data());
    cb(all.filter(i=>i.kind==='menu'), all.filter(i=>i.kind==='snack'));
  });
}
async function addCustomItem(item){
  if(!firebaseReady) return;
  await db.collection('menuItems').doc(item.id).set(item);
}
async function deleteCustomItem(id){
  if(!firebaseReady) return;
  await db.collection('menuItems').doc(id).delete();
}
// حفظ/استرجاع جلسة الدخول محليًا عشان مايحتاجش يعمل لوج إن كل مرة
function saveSession(){
  try{ localStorage.setItem('evraid_session', JSON.stringify({name: state.name, role: state.role})); }catch(e){}
}
function loadSession(){
  try{ const raw = localStorage.getItem('evraid_session'); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function clearSession(){
  try{ localStorage.removeItem('evraid_session'); }catch(e){}
}

// ---------- Data layer (Firestore) ----------
async function getBalance(name){
  if(!firebaseReady) return 0;
  try{
    const doc = await db.collection('balances').doc(name).get();
    return doc.exists ? (doc.data().value || 0) : 0;
  }catch(e){ return 0; }
}
async function addToBalance(name, delta){
  if(!firebaseReady) return;
  const ref = db.collection('balances').doc(name);
  await db.runTransaction(async (t)=>{
    const doc = await t.get(ref);
    const cur = doc.exists ? (doc.data().value || 0) : 0;
    t.set(ref, {value: cur + delta}, {merge:true});
  });
}
async function saveOrder(order){
  if(!firebaseReady) return;
  await db.collection('orders').doc(order.id).set(order);
}
async function markOrderDone(id){
  if(!firebaseReady) return;
  await db.collection('orders').doc(id).update({status:'done'});
}
async function confirmPayment(id){
  if(!firebaseReady) return;
  await db.collection('orders').doc(id).update({paymentConfirmed:true});
}

function listenOrders(cb){
  if(!firebaseReady) return ()=>{};
  return db.collection('orders').orderBy('ts','desc').onSnapshot(snap=>{
    cb(snap.docs.map(d=>d.data()));
  });
}
function listenBalances(cb){
  if(!firebaseReady) return ()=>{};
  return db.collection('balances').onSnapshot(snap=>{
    const out = snap.docs.map(d=>({name:d.id, value:d.data().value||0}));
    out.sort((a,b)=>a.value-b.value);
    cb(out);
  });
}

// ---------- Render ----------
function render(){
  const c = document.getElementById('content');
  if(!state.role){ c.innerHTML = roleScreen(); }
  else if(!state.name){ c.innerHTML = nameScreen(); }
  else if(state.role === 'employee' || state.role === 'admin'){
    if(state.tab === 'order') c.innerHTML = orderScreen();
    else if(state.tab === 'drinks') c.innerHTML = canSeeDrinks() ? drinksScreen() : orderScreen();
    else if(state.tab === 'balance') c.innerHTML = balanceScreen();
    else if(state.tab === 'admin') c.innerHTML = adminScreen();
  }
  else { c.innerHTML = state.kitchenUnlocked ? kitchenScreen() : kitchenGate(); }
  renderTabs();
  bindEvents();
}

    return `

function adminScreen(){
  const pending = state.orders.filter(o=>o.status==='pending');
  const ordersHtml = pending.length? pending.map(o=>orderRow(o,true,true)).join('') : `<div class="empty">لا توجد طلبات حاليًا</div>`;
  const historyHtml = state.orders.length? state.orders.slice(0,60).map(o=>orderRow(o,false,true)).join('') : `<div class="empty">لا يوجد سجل طلبات بعد</div>`;
  const balancesHtml = state.balances.length? `
    <table class="balances">
      <tr><th>الاسم</th><th>الرصيد</th><th></th></tr>
      ${state.balances.map(b=>`
        <tr>
          <td>${b.name}</td>
          <td style="color:${b.value<0?'#c53030':'var(--green-dark)'};font-weight:800;">${fmt(b.value)}</td>
          <td><button class="btn-ghost" style="padding:5px 8px;font-size:11px;" data-action="topup" data-name="${b.name}">تسجيل دفعة</button></td>
        </tr>`).join('')}
    </table>` : `<div class="empty">لا توجد أرصدة مسجلة بعد</div>`;
  // إجمالي المبيعات: بس الأصناف اللي بفلوس (مش المشروبات الفري) — إجمالي / اليوم / الشهر
  const paidOrders = state.orders.filter(o=>o.kind!=='drinks');
  const now = new Date();
  const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  const totalSales = paidOrders.reduce((s,o)=>s+o.total,0);
  const todayOrders = paidOrders.filter(o=>o.ts>=startOfDay);
  const todaySales = todayOrders.reduce((s,o)=>s+o.total,0);
  const monthSales = paidOrders.filter(o=>o.ts>=startOfMonth).reduce((s,o)=>s+o.total,0);
  const todayByMethod = {balance:0, cash:0, instapay:0};
  todayOrders.forEach(o=>{ todayByMethod[o.paymentMethod] = (todayByMethod[o.paymentMethod]||0) + o.total; });
  const salesHtml = `
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">
      <div class="balance-box" style="padding:8px;"><div class="small">النهاردة</div><div class="amt ok">${fmt(todaySales)}</div></div>
      <div class="balance-box" style="padding:8px;"><div class="small">الشهر ده</div><div class="amt ok">${fmt(monthSales)}</div></div>
      <div class="balance-box" style="padding:8px;"><div class="small">إجمالي كل الوقت</div><div class="amt ok">${fmt(totalSales)}</div></div>
    </div>
    <div class="small" style="margin-top:10px;font-weight:700;">تفصيل فلوس النهاردة حسب وسيلة الدفع</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:6px;">
      <div class="balance-box" style="padding:8px;"><div class="small">💳 من الرصيد</div><div class="amt ok">${fmt(todayByMethod.balance)}</div></div>
      <div class="balance-box" style="padding:8px;"><div class="small">💵 كاش</div><div class="amt ok">${fmt(todayByMethod.cash)}</div></div>
      <div class="balance-box" style="padding:8px;"><div class="small">📲 إنستاباي</div><div class="amt ok">${fmt(todayByMethod.instapay)}</div></div>
    </div>`;
  // دفعات كاش لسه مستلمتش الفلوس عنها
  const unpaidCash = state.orders.filter(o=>o.kind!=='drinks' && o.paymentMethod==='cash' && !o.paymentConfirmed);
  const unpaidCashHtml = unpaidCash.length? unpaidCash.map(o=>orderRow(o,false,true)).join('') : `<div class="empty">مفيش دفعات كاش معلّقة</div>`;
  // سجل كل موظف: عدد الطلبات، إجمالي المبلغ، والأصناف اللي طلبها
  const byEmployee = {};
  paidOrders.forEach(o=>{
    if(!byEmployee[o.name]) byEmployee[o.name] = {total:0, count:0, items:{}};
    byEmployee[o.name].total += o.total;
    byEmployee[o.name].count += 1;
    o.items.forEach(i=>{
      byEmployee[o.name].items[i.name] = (byEmployee[o.name].items[i.name]||0) + i.qty;
    });
  });
  const employeeNames = Object.keys(byEmployee).sort((a,b)=>byEmployee[b].total-byEmployee[a].total);
  const employeeLedgerHtml = employeeNames.length? `
    <table class="balances">
      <tr><th>الاسم</th><th>عدد الطلبات</th><th>الإجمالي</th><th>الأصناف</th></tr>
      ${employeeNames.map(name=>{
        const e = byEmployee[name];
        const itemsStr = Object.keys(e.items).map(n=>`${n} ×${e.items[n]}`).join('، ');
        return `<tr>
          <td>${name}</td>
          <td>${e.count}</td>
          <td style="font-weight:800;">${fmt(e.total)}</td>
          <td class="small">${itemsStr}</td>
        </tr>`;
      }).join('')}
    </table>` : `<div class="empty">لا يوجد سجل طلبات مدفوعة بعد</div>`;
  const stockableItems = [
    ...MENU.map(it=>({id:it.id, name:it.name, cat:'بوفيه', custom:false})),
    ...state.customMenu.map(it=>({id:it.id, name:it.name, cat:'بوفيه', custom:true})),
    ...SNACKS.map(it=>({id:it.id, name:it.name, cat:'سناكس', custom:false})),
    ...state.customSnacks.map(it=>({id:it.id, name:it.name, cat:'سناكس', custom:true})),
    ...DRINKS.map(it=>({id:it.id, name:it.name, cat:'مشروبات', custom:false})),
  ];
  const stockHtml = `
    <table class="balances">
      <tr><th>الصنف</th><th>الحالة</th><th></th></tr>
      ${stockableItems.map(it=>{
        const isOut = state.outOfStock.has(it.id);
        return `<tr>
          <td>${it.name} <span class="small">(${it.cat}${it.custom?' — مُضاف':''})</span></td>
          <td style="color:${isOut?'#c53030':'var(--green-dark)'};font-weight:800;">${isOut?'متوقف':'متاح'}</td>
          <td>
            <button class="btn-ghost" style="padding:5px 8px;font-size:11px;" data-action="toggleStock" data-id="${it.id}">${isOut?'إعادة تفعيل':'إيقاف'}</button>
            ${it.custom? `<button class="btn-ghost" style="padding:5px 8px;font-size:11px;color:#c53030;" data-action="deleteItem" data-id="${it.id}">حذف</button>`:''}
          </td>
        </tr>`;
      }).join('')}
    </table>`;
  const addItemFormHtml = `
    <div style="margin-top:14px;">
      <label>القسم</label>
      <select id="newItemCat" style="width:100%;padding:9px;border-radius:10px;border:1.5px solid var(--line);background:var(--card-2);">
        <option value="menu">بوفيه</option>
        <option value="snack">سناكس</option>
      </select>
      <label style="margin-top:8px;">اسم الصنف</label>
      <input type="text" id="newItemName" placeholder="مثلاً: سندوتش تونة" />
      <label style="margin-top:8px;">السعر</label>
      <input type="number" id="newItemPrice" placeholder="مثلاً: 20" />
      <button class="btn-main" style="margin-top:10px;" data-action="addMenuItem">إضافة الصنف</button>
    </div>`;
  return `
  <div class="card" style="display:flex;justify-content:space-between;align-items:center;">
    <div><div class="small">لوحة التحكم</div><div style="font-weight:900;font-size:16px;">${state.name}</div></div>
    <button class="btn-ghost" data-action="switchUser">تغيير المستخدم</button>
  </div>
  <div class="card"><h2>إجمالي المبيعات</h2>${salesHtml}</div>
  <div class="card"><h2>دفعات كاش محتاجة تأكيد</h2><p class="small" style="margin-top:-6px;">دوس "تأكيد استلام الفلوس" بعد ما توصلك الفلوس فعليًا</p>${unpaidCashHtml}</div>
  <div class="card"><h2>سجل كل موظف</h2><p class="small" style="margin-top:-6px;">إجمالي كل حد وإيه اللي طلبه (الأصناف المدفوعة بس)</p>${employeeLedgerHtml}</div>
  <div class="card"><h2>الطلبات الجديدة</h2>${ordersHtml}</div>
  <div class="card"><h2>سجل كل الطلبات</h2><p class="small" style="margin-top:-6px;">آخر 60 طلب، الأحدث أولًا</p>${historyHtml}</div>
  <div class="card"><h2>الأرصدة</h2>${balancesHtml}</div>
  <div class="card"><h2>إدارة المخزون والأصناف</h2><p class="small" style="margin-top:-6px;">أوقف أي صنف عشان محدش يقدر يطلبه، أو ضيف صنف جديد</p>${stockHtml}${addItemFormHtml}</div>`;

function orderRow(o, isPending, isAdminView){
  const itemsStr = o.items.map(i=> i.type ? `${i.name} (${i.type==='baladi'?'بلدي':'فرنساوي'}) ×${i.qty}` : `${i.name} ×${i.qty}`).join('، ');
  const time = new Date(o.ts).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
  const isDrinks = o.kind === 'drinks';
  const payLabel = o.paymentMethod==='cash'? '💵 كاش' : o.paymentMethod==='instapay' ? '📲 إنستاباي' : '💳 رصيد';
  const payBadge = !isDrinks ? payLabel : '';
  const instapayInfo = (!isDrinks && o.paymentMethod==='instapay') ? `
    <div class="small" style="margin-top:6px;">حوّل من: ${o.instapaySender||''}</div>
    ${o.instapayScreenshot? `<img src="${o.instapayScreenshot}" style="max-width:120px;border-radius:8px;margin-top:6px;cursor:pointer;" onclick="window.open(this.src)" />`:''}` : '';
  const needsPaymentConfirm = isAdminView && !isDrinks && o.paymentMethod==='cash' && !o.paymentConfirmed;
  const paymentBadge = (!isDrinks && o.paymentMethod==='cash') ? `
    <div class="small" style="margin-top:4px;color:${o.paymentConfirmed?'var(--green-dark)':'#c53030'};font-weight:700;">${o.paymentConfirmed? '✓ الفلوس استلمت':'⏳ لسه مستلمتش الفلوس'}</div>` : '';
  return `
  <div class="order-row ${isPending && !state.seenOrderIds.has(o.id) ? 'new':''}">
    <div class="top"><span>${o.name} ${isDrinks? '☕':''}</span><span>${isDrinks? 'مشروبات' : fmt(o.total)}</span></div>
    <div class="items">${itemsStr}</div>
    <div class="small">${time}${payBadge? ' · '+payBadge : ''}</div>
    ${paymentBadge}
    ${instapayInfo}
    <div class="actions">
      ${isPending? `<button class="btn-ghost" data-action="markDone" data-id="${o.id}">تم التجهيز ✓</button>`:''}
      ${needsPaymentConfirm? `<button class="btn-ghost" data-action="confirmPayment" data-id="${o.id}">تأكيد استلام الفلوس 💵</button>`:''}
    </div>
  </div>`;
}
function renderTabs(){
  const tb = document.getElementById('tabbar');
  if(!state.role || !state.name){ tb.innerHTML=''; return; }
  if(state.role==='employee'){
    tb.innerHTML = `
      <button class="tab ${state.tab==='order'?'active':''}" data-action="tab" data-tab="order"><span class="ic">🍽️</span>بوفيه وسناكس</button>
      ${canSeeDrinks()? `<button class="tab ${state.tab==='drinks'?'active':''}" data-action="tab" data-tab="drinks"><span class="ic">☕</span>مشروبات</button>`:''}
      <button class="tab ${state.tab==='balance'?'active':''}" data-action="tab" data-tab="balance"><span class="ic">💰</span>رصيدي</button>`;
  } else if(state.role==='admin'){
    tb.innerHTML = `
      <button class="tab ${state.tab==='order'?'active':''}" data-action="tab" data-tab="order"><span class="ic">🍽️</span>بوفيه وسناكس</button>
      ${canSeeDrinks()? `<button class="tab ${state.tab==='drinks'?'active':''}" data-action="tab" data-tab="drinks"><span class="ic">☕</span>مشروبات</button>`:''}
      <button class="tab ${state.tab==='balance'?'active':''}" data-action="tab" data-tab="balance"><span class="ic">💰</span>رصيدي</button>
      <button class="tab ${state.tab==='admin'?'active':''}" data-action="tab" data-tab="admin"><span class="ic">🛠️</span>لوحة التحكم</button>`;
  } else {
    tb.innerHTML = `<button class="tab active"><span class="ic">🍳</span>لوحة المطبخ</button>`;
  }
}
function bindEvents(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    el.onclick = async ()=>{
      const action = el.dataset.action;
      if(action==='role'){ state.role = el.dataset.role; render(); }
      else if(action==='backRole'){ state.role = null; state.kitchenUnlocked=false; render(); }
      else if(action==='doLogin'){ await doLogin(); }
      else if(action==='switchUser'){
        state.name=''; state.role=null; state.cart={}; state.drinkCart={}; state.snackCart={}; state.isAdmin=false;
        clearSession();
        if(state._unsubOrders){ state._unsubOrders(); state._unsubOrders=null; }
        if(state._unsubBalances){ state._unsubBalances(); state._unsubBalances=null; }
        if(state._unsubStock){ state._unsubStock(); state._unsubStock=null; }
        if(state._unsubCustomItems){ state._unsubCustomItems(); state._unsubCustomItems=null; }
        render();
      }
      else if(action==='setPayment'){ state.paymentMethod = el.dataset.method; render(); }
      else if(action==='pick'){
        const id = el.dataset.id, type = el.dataset.type;
        if(!state.cart[id]) state.cart[id] = {type, qty:1};
        else state.cart[id].type = type;
        render();
      }
      else if(action==='inc'){ state.cart[el.dataset.id].qty++; render(); }
      else if(action==='dec'){
        const id = el.dataset.id;
        state.cart[id].qty--;
        if(state.cart[id].qty<=0) delete state.cart[id];
        render();
      }
      else if(action==='confirmOrder'){ await submitOrder(); }
      else if(action==='incDrink'){
        const id = el.dataset.id;
        if(!state.drinkCart[id]) state.drinkCart[id] = {qty:1};
        else state.drinkCart[id].qty++;
        render();
      }
      else if(action==='decDrink'){
        const id = el.dataset.id;
        state.drinkCart[id].qty--;
        if(state.drinkCart[id].qty<=0) delete state.drinkCart[id];
        render();
      }
      else if(action==='confirmDrinkOrder'){ await submitDrinkOrder(); }
      else if(action==='tab'){ state.tab = el.dataset.tab; render(); if(state.tab==='balance') refreshMyOrders(); }
      else if(action==='unlockKitchen'){
        state.kitchenUnlocked = true;
        render();
        prepAlerts();
        state._unsubOrders = listenOrders(onOrdersUpdate);
        state._unsubBalances = listenBalances(onBalancesUpdate);
        if(!state._unsubStock) state._unsubStock = listenOutOfStock(ids=>{ state.outOfStock = new Set(ids); render(); });
      }
      else if(action==='markDone'){ await markOrderDone(el.dataset.id); }
      else if(action==='confirmPayment'){ await confirmPayment(el.dataset.id); }
      else if(action==='toggleStock'){ await toggleStock(el.dataset.id); }
      else if(action==='incSnack'){
        const id = el.dataset.id;
        if(!state.snackCart[id]) state.snackCart[id] = {qty:1};
        else state.snackCart[id].qty++;
        render();
      }
      else if(action==='decSnack'){
        const id = el.dataset.id;
        state.snackCart[id].qty--;
        if(state.snackCart[id].qty<=0) delete state.snackCart[id];
        render();
      }
      else if(action==='confirmSnackOrder'){ await submitOrder(); }
      else if(action==='addMenuItem'){ await handleAddMenuItem(); }
      else if(action==='deleteItem'){
        if(confirm('متأكد إنك عايز تحذف الصنف ده؟')) await deleteCustomItem(el.dataset.id);
      }
      else if(action==='topup'){
        const name = el.dataset.name;
        const amt = prompt('قيمة الدفعة (ج.م) لـ '+name+':');
        if(amt && !isNaN(amt) && parseFloat(amt)>0){
          await addToBalance(name, parseFloat(amt));
          toast('تم تسجيل الدفعة بنجاح');
        }
      }
    };
  });
}
async function afterLogin(){
  if(state.role==='employee' || state.role==='admin'){ state.balance = await getBalance(state.name); }
  render();
  if(state.role==='employee' || state.role==='admin') refreshMyOrders();
  if(state.role==='admin'){
    if(!state._unsubOrders) state._unsubOrders = listenOrders(onOrdersUpdate);
    if(!state._unsubBalances) state._unsubBalances = listenBalances(onBalancesUpdate);
  }
  if(!state._unsubStock) state._unsubStock = listenOutOfStock(ids=>{ state.outOfStock = new Set(ids); render(); });
  if(!state._unsubCustomItems) state._unsubCustomItems = listenCustomItems((menuItems, snackItems)=>{
    state.customMenu = menuItems; state.customSnacks = snackItems; render();
  });
}
async function doLogin(){
  const u = document.getElementById('userInput').value.trim();
  const p = document.getElementById('passInput').value;
  if(!u || !p){ toast('يرجى إدخال الإيميل وكلمة المرور'); return; }
  if(!/^[^\s@]+@evraid\.com$/i.test(u)){ toast('لازم تسجل بإيميل بصيغة اسم@evraid.com'); return; }
  if(p.length < 4){ toast('كلمة المرور لازم تكون 4 حروف على الأقل'); return; }
  if(!firebaseReady){ toast('يجب إعداد بيانات Firebase أولًا'); return; }
  try{
    const ref = db.collection('users').doc(u);
    const doc = await ref.get();
    const hashed = await hashPass(p);
    if(doc.exists){
      if(doc.data().password !== hashed){
        toast('كلمة المرور غير صحيحة');
        return;
      }
    } else {
      await ref.set({password: hashed, createdAt: Date.now()});
      toast('تم إنشاء الحساب بنجاح');
    }
    state.name = u;
    state.isAdmin = u.toLowerCase() === ADMIN_EMAIL.toLowerCase();
    if(state.isAdmin){ state.role = 'admin'; }
    saveSession();
    await afterLogin();
  }catch(e){ toast('حدث خطأ أثناء تسجيل الدخول'); }
}
async function buildInstapayFields(){
  if(state.paymentMethod !== 'instapay') return {ok:true, extra:{}};
  const phoneEl = document.getElementById('instapayPhoneInput');
  const fileEl = document.getElementById('instapayFileInput');
  const phone = phoneEl ? phoneEl.value.trim() : '';
  const file = fileEl && fileEl.files ? fileEl.files[0] : null;
  if(!phone){ toast('يرجى كتابة الرقم اللي حوّلت منه'); return {ok:false}; }
  if(!/^[0-9]{11}$/.test(phone)){ toast('الرقم لازم يكون أرقام بس ومكوّن من 11 رقم'); return {ok:false}; }
  if(!file){ toast('يرجى إرفاق اسكرين شوت التحويل'); return {ok:false}; }
  try{
    const screenshot = await fileToCompressedBase64(file);
    return {ok:true, extra:{instapaySender: phone, instapayScreenshot: screenshot}};
  }catch(e){ toast('تعذر قراءة الصورة، حاول تاني'); return {ok:false}; }
}
async function handleAddMenuItem(){
  const catEl = document.getElementById('newItemCat');
  const nameEl = document.getElementById('newItemName');
  const priceEl = document.getElementById('newItemPrice');
  const cat = catEl ? catEl.value : 'menu';
  const name = nameEl ? nameEl.value.trim() : '';
  const price = priceEl ? Number(priceEl.value) : NaN;
  if(!name){ toast('اكتب اسم الصنف'); return; }
  if(!price || price<=0){ toast('اكتب سعر صحيح'); return; }
  const item = {
    id: 'custom_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
    name, addedAt: Date.now(),
  };
  if(cat==='menu'){ item.baladi = price; item.fransawi = null; item.kind='menu'; }
  else { item.price = price; item.kind='snack'; }
  try{
    await addCustomItem(item);
    toast('تم إضافة الصنف');
    render();
  }catch(e){ toast('حدث خطأ أثناء الإضافة'); }
}
async function submitOrder(){
  if(Object.keys(state.cart).length===0 && Object.keys(state.snackCart).length===0) return;
  if(!firebaseReady){ toast('يجب إعداد بيانات Firebase أولًا'); return; }
  const items = []; let total = 0;
  for(const id in state.cart){
    const it = allMenuItems().find(m=>m.id===id);
    const c = state.cart[id];
    const price = c.type==='baladi'? it.baladi : it.fransawi;
    items.push({name:it.name, type:c.type, qty:c.qty, price});
    total += price*c.qty;
  }
  for(const id in state.snackCart){
    const s = allSnackItems().find(m=>m.id===id);
    const c = state.snackCart[id];
    items.push({name:s.name, qty:c.qty, price:s.price});
    total += s.price*c.qty;
  }
  const method = state.paymentMethod === 'cash' ? 'cash' : (state.paymentMethod==='instapay' ? 'instapay' : 'balance');
  const ip = await buildInstapayFields();
  if(!ip.ok) return;
  const order = {
    id: 'order_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    name: state.name, items, total, paymentMethod: method, paymentConfirmed: method !== 'cash', ts: Date.now(), status: 'pending', ...ip.extra
  };
  try{
    await saveOrder(order);
    if(method === 'balance'){
      await addToBalance(state.name, -total);
      state.balance = state.balance - total;
    }
    state.cart = {};
    state.snackCart = {};
    toast(method==='cash' ? 'تم إرسال الطلب — الدفع كاش عند الاستلام' : method==='instapay' ? 'تم إرسال الطلب — بانتظار تأكيد التحويل' : 'تم إرسال الطلب إلى المطبخ');
    render();
    sendChefEmail(order);
  }catch(e){ toast('حدث خطأ، يرجى المحاولة مرة أخرى'); }
}
async function submitDrinkOrder(){
  if(Object.keys(state.drinkCart).length===0) return;
  if(!firebaseReady){ toast('يجب إعداد بيانات Firebase أولًا'); return; }
  const items = [];
  for(const id in state.drinkCart){
    const d = DRINKS.find(m=>m.id===id);
    items.push({name:d.name, qty:state.drinkCart[id].qty, price:0});
  }
  const order = {
    id: 'order_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    name: state.name, items, total: 0, kind:'drinks', ts: Date.now(), status: 'pending'
  };
  try{
    await saveOrder(order);
    state.drinkCart = {};
    toast('تم إرسال طلب المشروبات إلى المطبخ');
    render();
    sendChefEmail(order);
  }catch(e){ toast('حدث خطأ، يرجى المحاولة مرة أخرى'); }
}
async function refreshMyOrders(){
  const el = document.getElementById('myOrdersList');
  if(!el || !firebaseReady) { if(el) el.innerHTML = `<div class="empty">ستظهر الطلبات هنا بعد إعداد Firebase</div>`; return; }
  db.collection('orders').where('name','==',state.name).orderBy('ts','desc').limit(8).get().then(snap=>{
    const mine = snap.docs.map(d=>d.data());
    if(mine.length===0){ el.innerHTML = `<div class="empty">لم يتم تقديم أي طلب بعد</div>`; return; }
    el.innerHTML = mine.map(o=>{
      const itemsStr = o.items.map(i=>`${i.name} ×${i.qty}`).join('، ');
      const time = new Date(o.ts).toLocaleString('ar-EG',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'numeric'});
      const label = o.kind==='drinks' ? 'مشروبات ☕' : fmt(o.total);
      return `<div class="order-row"><div class="top"><span>${label}</span><span>${o.status==='done'?'✅ جاهز':'⏳ قيد التحضير'}</span></div><div class="items">${itemsStr}</div><div class="small">${time}</div></div>`;
    }).join('');
  }).catch(()=>{ el.innerHTML = `<div class="empty">تعذر تحميل الطلبات</div>`; });
}
function prepAlerts(){
  try{ if(window.Notification && Notification.permission==='default'){ Notification.requestPermission(); } }catch(e){}
  try{
    if(!state._audioCtx){ state._audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    if(state._audioCtx.state === 'suspended'){ state._audioCtx.resume(); }
  }catch(e){}
}
function playBeep(){
  try{
    const ctx = state._audioCtx;
    if(!ctx) return;
    const beepOnce = (delay)=>{
      setTimeout(()=>{
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.4, ctx.currentTime+0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.35);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime+0.4);
      }, delay);
    };
    beepOnce(0); beepOnce(450);
  }catch(e){}
}
function onOrdersUpdate(orders){
  const prevPendingIds = new Set(state.orders.filter(o=>o.status==='pending').map(o=>o.id));
  const newPending = orders.filter(o=>o.status==='pending' && !prevPendingIds.has(o.id) && state.hasPolledOnce);
  state.orders = orders;
  const isKitchenDevice = state.role==='kitchen' && state.kitchenUnlocked;
  if(newPending.length>0 && isKitchenDevice){
    toast('تم استلام طلب جديد');
    playBeep();
    try{ if(window.Notification && Notification.permission==='granted'){ new Notification('EVRAID - طلب جديد', {body: newPending[0].name}); } }catch(e){}
  }
  state.hasPolledOnce = true;
  if(isKitchenDevice || state.role==='admin') render();
}
function onBalancesUpdate(balances){
  state.balances = balances;
  if((state.role==='kitchen' && state.kitchenUnlocked) || state.role==='admin') render();
}

// استرجاع الجلسة المحفوظة (لو المستخدم سجل دخول قبل كده على نفس الجهاز)
(function restoreSession(){
  const saved = loadSession();
  if(saved && saved.name && saved.role){
    state.name = saved.name;
    state.role = saved.role;
    state.isAdmin = saved.name.toLowerCase() === ADMIN_EMAIL.toLowerCase();
    if(firebaseReady){ afterLogin(); } else {
      const check = setInterval(()=>{
        if(firebaseReady){ clearInterval(check); afterLogin(); }
      }, 200);
    }
  }
})();

render();
</script>
